[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "eyenav"
version = "0.1.0-alpha"
description = "Intent-First Eye Navigation Platform — Hands-Free HCI via Gaze, Blinks, and Eyebrow Gestures"
license = {text = "MIT"}
authors = [{name = "EyeNav Research Team", email = "research@eyenav.ai"}]
keywords = ["eye-tracking", "gaze-estimation", "HCI", "accessibility", "computer-vision", "intent-recognition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB)",
]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.urls]
Homepage = "https://eyenav.ai"
Repository = "https://github.com/eyenav/eyenav"
Documentation = "https://docs.eyenav.ai"
Research = "https://research.eyenav.ai"

[project.scripts]
eyenav = "eyenav.cli:main"

# ─────────────────────────────
# Ruff Linter Configuration
# ─────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "ANN", # type annotations
    "D",   # pydocstyle
]
ignore = [
    "D100", "D101", "D102", "D103", "D104",  # Missing docstrings in modules/classes/functions
    "ANN101",  # Missing type annotation for self
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ─────────────────────────────
# MyPy Type Checking
# ─────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "benchmarks/"]

# ─────────────────────────────
# Pytest Configuration
# ─────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",  # Show extra summary for all except passed
]
markers = [
    "safety_critical: Mark test as safety-critical (must pass 100%)",
    "slow: Tests that take > 1 second",
    "requires_camera: Tests that require a physical camera",
    "requires_gpu: Tests that require GPU",
    "integration: Integration tests",
    "benchmark: Performance benchmark tests",
]

# ─────────────────────────────
# Coverage Configuration
# ─────────────────────────────
[tool.coverage.run]
source = ["backend/eyenav"]
omit = [
    "*/tests/*",
    "*/benchmarks/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
]

# ─────────────────────────────
# Bandit Security Config
# ─────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", "benchmarks"]
skips = ["B101"]  # Skip assert warnings (acceptable in test-adjacent code)
