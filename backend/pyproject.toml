[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eyenav"
version = "1.0.0a1"
description = "EyeNav — Intent-First Eye Navigation Platform"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
]

[project.optional-dependencies]
inference = [
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.9",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eyenav*"]
