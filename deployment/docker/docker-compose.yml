version: "3.9"

# EyeNav Server Mode — Docker Compose
# =====================================
# Development/Research deployment with full monitoring stack.
#
# Start: docker-compose up -d
# Stop: docker-compose down
#
# Services:
#   - eyenav-server: Main inference API server
#   - redis: Session state and feature cache
#   - postgres: User profiles and telemetry
#   - mlflow: Experiment tracking
#   - prometheus: Metrics collection
#   - grafana: Metrics visualization

services:

  # ─── EyeNav Inference Server ──────────────────────────────────────────────
  eyenav-server:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    image: eyenav/server:latest
    container_name: eyenav-server
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - EYENAV_ENV=development
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://eyenav:eyenav_dev@postgres:5432/eyenav
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ../../models:/app/models:ro          # Read-only model files
      - eyenav-profiles:/app/data/profiles   # User profiles
    depends_on:
      - redis
      - postgres
    networks:
      - eyenav-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Redis (Session Cache) ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eyenav-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - eyenav-net
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ─── PostgreSQL (Profiles & Telemetry) ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: eyenav-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eyenav
      POSTGRES_USER: eyenav
      POSTGRES_PASSWORD: eyenav_dev  # Change in production!
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - eyenav-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eyenav"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MLFlow (Experiment Tracking) ─────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.0
    container_name: eyenav-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://eyenav:eyenav_dev@postgres:5432/mlflow
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow-artifacts
    volumes:
      - mlflow-artifacts:/mlflow-artifacts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eyenav-net
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri postgresql://eyenav:eyenav_dev@postgres:5432/mlflow
        --default-artifact-root /mlflow-artifacts

  # ─── Prometheus (Metrics) ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: eyenav-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - eyenav-net

  # ─── Grafana (Dashboards) ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.1
    container_name: eyenav-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin_dev  # Change in production!
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - eyenav-net

networks:
  eyenav-net:
    driver: bridge

volumes:
  eyenav-profiles:
  redis-data:
  postgres-data:
  mlflow-artifacts:
  prometheus-data:
  grafana-data:
