name: IntuiGaze lightweight quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Chromium for Playwright tests
        run: python -m playwright install --with-deps chromium

      - name: Compile dataset-audit utility
        run: python -m py_compile scripts/audit_dataset.py

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Lint relevant source and tests
        run: ruff check backend/ tests/ scripts/

      # Deliberately no camera, GPU, real desktop cursor, dataset, or model training here.
